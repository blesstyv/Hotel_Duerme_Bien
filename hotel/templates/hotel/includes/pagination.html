{% if page_obj.paginator.num_pages > 1 %}
<nav class="pagination" aria-label="Páginas de resultados"><span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} registros</span><div>{% if page_obj.has_previous %}<a class="btn btn-small btn-secondary" href="?q={{ q|urlencode }}&estado={{ estado|urlencode }}&activa={{ activa|urlencode }}&orientacion={{ orientacion|urlencode }}&page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-small btn-secondary" href="?q={{ q|urlencode }}&estado={{ estado|urlencode }}&activa={{ activa|urlencode }}&orientacion={{ orientacion|urlencode }}&page={{ page_obj.next_page_number }}">Siguiente</a>{% endif %}</div></nav>
{% endif %}
