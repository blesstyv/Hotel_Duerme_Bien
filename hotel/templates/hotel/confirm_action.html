{% extends 'hotel/base.html' %}{% load hotel_tags %}{% block content %}
<section class="panel confirm-panel"><div class="confirm-content"><div class="confirm-icon">{% icon 'info' %}</div><h2>{{ title }}</h2><p>{{ message }}</p>{% if objeto %}<span class="object-name">{{ objeto }}</span>{% endif %}</div><form method="post">{% csrf_token %}<div class="form-actions"><a class="btn btn-secondary" href="{{ cancel_url }}">Cancelar</a><button class="btn btn-primary" type="submit">{{ submit_label|default:'Confirmar' }}</button></div></form></section>
{% endblock %}
