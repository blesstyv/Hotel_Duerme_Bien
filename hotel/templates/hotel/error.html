{% load static hotel_tags %}
<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }} · Hotel Duerme Bien</title><link rel="stylesheet" href="{% static 'hotel/css/app.css' %}"><link rel="icon" type="image/svg+xml" href="{% static 'hotel/img/favicon.svg' %}"></head><body class="login-body"><header class="login-header"><a class="brand" href="{% url 'hotel:inicio' %}"><span class="brand-mark">{% icon 'bed' %}</span><span><strong>Hotel Duerme Bien</strong><small>Sistema de Gestión de Pasajeros</small></span></a></header><main class="error-page"><div class="confirm-icon">{% icon 'shield' %}</div><span class="eyebrow">ERROR {{ code }}</span><h1>{{ title }}</h1><p>{{ message }}</p><a href="{% if user.is_authenticated %}{% url 'hotel:inicio' %}{% else %}{% url 'hotel:login' %}{% endif %}" class="btn btn-primary">{% icon 'home' %} {% if user.is_authenticated %}Volver al panel{% else %}Iniciar sesión{% endif %}</a></main></body></html>
